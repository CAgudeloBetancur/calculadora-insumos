# .github/workflows/ci.yml
# Integración continua: lint + pruebas + build en cada push y PR.
# Ver sldc/05-revision.md → "Estrategia de pruebas".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela la ejecución anterior si llega un push más nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7